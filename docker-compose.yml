services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app            
    ports:
      - "3000:3000"      
    command: npm run start
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  cypress:
    image: cypress/included:14.5.4
    working_dir: /e2e
    volumes:
      - .:/e2e
    environment:
      CYPRESS_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy
    command: cypress run