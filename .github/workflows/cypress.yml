name: Execução de Testes Cypress via Docker

on:
  push:
    branches: [ main ] # Dispara automático no push
  workflow_dispatch:  # Ativa o botão para execução manual
    inputs:
      ambiente_url:
        description: 'Digite uma URL (Em branco: tenta o Segredo do GitHub; Se não houver Segredo: usa o site Local)'
        required: false
        default: '' # Nasce vazio para priorizar o cofre ou o local

jobs:
  rodar-testes:
    runs-on: ubuntu-latest # Máquina do GitHub com Docker de fábrica

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Executar Containers e Rodar Testes
        env:
          # 🧠 A TRÍPLICE COROA DA LOGICA:
          # Opção 1: Se você digitou algo no input manual, ele usa.
          # Opção 2: Se o input ficou vazio, ele tenta ler o cofre 'secrets.MINHA_URL_SECRETA'.
          # Opção 3: Se o cofre também não existir, ele cai no plano C e usa o 'http://web:3000' local.
          CYPRESS_BASE_URL: ${{ github.event.inputs.ambiente_url || secrets.MINHA_URL_SECRETA || 'http://web:3000' }}
        run: |
           docker compose up --abort-on-container-exit --exit-code-from cypress || true

      - name: Salvar Screenshots de Falha (Nativo)
        if: always() # Garante que o passo vai rodar mesmo com os testes falhando
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-de-falha-cypress
          # 🧠 IMPORTANTE: "ignore" faz o GitHub não dar erro se todos os testes passarem 
          # (já que a pasta de screenshots só nasce se houver um erro real)
          if-no-files-found: ignore
          path: cypress/screenshots/