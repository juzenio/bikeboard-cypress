name: Execução de Testes Cypress via Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ambiente_url:
        description: 'Digite uma URL (Em branco: tenta o Segredo do GitHub; Se não houver Segredo: usa o site Local)'
        required: false
        default: ''

jobs:
  rodar-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Executar Containers e Rodar Testes
        env:
          CYPRESS_BASE_URL: ${{ github.event.inputs.ambiente_url || secrets.MINHA_URL_SECRETA || 'http://web:3000' }}
        run: |
          docker compose up --abort-on-container-exit --exit-code-from cypress

      # 📊 PASSO NOVO: Lê o relatório do Cypress e desenha na página do GitHub
      - name: Publicar Resultado dos Testes na Página do GitHub
        if: always() # Garante que vai desenhar a tabela mesmo se algum teste falhar
        run: |
          # O npx roda a ferramenta CTRF que lê o JSON gerado e joga no sumário do GitHub
          npx github-actions-ctrf ctrf/ctrf-report.json

      - name: Salvar Evidências e Prints do Cypress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-cypress
          path: |
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
